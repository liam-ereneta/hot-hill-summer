<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Hill Summer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FC4C02;
    --orange-dim: #c93d01;
    --black: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --surface3: #282828;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --muted: #888;
    --muted2: #555;
    --gold: #f5c842;
    --silver: #b0b8c1;
    --bronze: #cd7f32;
    --green: #22c55e;
    --radius: 8px;
    --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--orange);
  }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .avatar-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 99px;
    padding: 5px 12px 5px 6px;
    font-size: 13px;
    font-weight: 500;
  }
  .avatar-img {
    width: 26px; height: 26px; border-radius: 50%;
    object-fit: cover; background: var(--surface3);
  }
  .btn {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--orange-dim); }
  .btn:active { transform: scale(0.97); }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  /* ── MAIN LAYOUT ── */
  main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  /* ── HERO ── */
  .hero { text-align: center; margin-bottom: 3rem; }
  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 10vw, 88px);
    letter-spacing: 4px;
    line-height: 1;
    color: var(--text);
  }
  .hero h1 em { color: var(--orange); font-style: normal; }
  .hero p { color: var(--muted); font-size: 15px; margin-top: 10px; }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    margin-bottom: 1.5rem;
  }
  .stat-chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }
  .chip strong { color: var(--text); }

  /* ── LEADERBOARD TABLE ── */
  .lb-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .lb-head {
    display: grid;
    grid-template-columns: 48px 1fr 110px 110px 110px;
    gap: 0;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .lb-row {
    display: grid;
    grid-template-columns: 48px 1fr 110px 110px 110px;
    gap: 0;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.12s;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row:hover { background: var(--surface2); }
  .lb-row.is-you { background: rgba(252,76,2,0.06); }
  .lb-row.is-you:hover { background: rgba(252,76,2,0.1); }

  .rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--muted2);
    line-height: 1;
  }
  .rank.r1 { color: var(--gold); }
  .rank.r2 { color: var(--silver); }
  .rank.r3 { color: var(--bronze); }

  .athlete-cell { display: flex; align-items: center; gap: 12px; }
  .ath-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    object-fit: cover; background: var(--surface3);
    flex-shrink: 0;
  }
  .ath-name { font-weight: 500; font-size: 14px; }
  .ath-you {
    font-size: 10px; font-family: 'DM Mono', monospace;
    background: var(--orange); color: #fff;
    border-radius: 4px; padding: 1px 5px; margin-left: 6px;
    vertical-align: middle;
  }

  .lb-num {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
  }
  .lb-num.segs-done { font-size: 16px; font-weight: 500; }
  .seg-bar-wrap {
    display: flex; align-items: center; gap: 6px;
    font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted);
  }
  .seg-bar {
    width: 60px; height: 4px;
    background: var(--surface3);
    border-radius: 99px; overflow: hidden;
  }
  .seg-bar-fill {
    height: 100%; background: var(--orange);
    border-radius: 99px;
    transition: width 0.6s ease;
  }

  /* ── SEGMENTS PANEL ── */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 1rem;
  }
  .segments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 2.5rem;
  }
  .seg-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
  }
  .seg-card-name {
    font-weight: 500; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .seg-card-id {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--muted);
  }
  .seg-card-dot {
    display: inline-block;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted2); margin-right: 6px; vertical-align: middle;
  }
  .seg-card-dot.done { background: var(--orange); }
  .seg-card-dot.loading { background: var(--gold); }

  /* ── EMPTY / LOADING STATES ── */
  .empty-state {
    text-align: center; padding: 4rem 1rem;
    color: var(--muted);
  }
  .empty-state .big-icon {
    font-size: 48px; margin-bottom: 1rem; opacity: 0.4;
  }
  .empty-state h2 { font-size: 18px; color: var(--text); margin-bottom: 6px; font-weight: 400; }
  .empty-state p { font-size: 14px; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .notice {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 8px;
  }
  .notice a { color: var(--orange); text-decoration: none; }
  .notice a:hover { text-decoration: underline; }

  /* ── CONNECT SCREEN ── */
  #connect-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 70vh; text-align: center;
    gap: 1rem;
  }
  #connect-screen .big-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px; letter-spacing: 6px; color: var(--orange);
  }
  #connect-screen h2 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300; font-size: 20px; color: var(--muted);
    max-width: 380px;
  }
  .strava-btn {
    display: flex; align-items: center; gap: 10px;
    background: var(--orange); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 13px 28px;
    font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 16px;
    cursor: pointer; transition: background 0.15s;
    margin-top: 0.5rem;
  }
  .strava-btn:hover { background: var(--orange-dim); }
  .strava-btn svg { width: 22px; height: 22px; fill: #fff; }

  /* ── ADMIN PANEL ── */
  #admin-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 2rem;
  }
  #admin-panel h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 1px; margin-bottom: 1rem;
    color: var(--muted);
  }
  .admin-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .admin-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius); color: var(--text); padding: 8px 12px;
    font-family: 'DM Mono', monospace; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  .admin-row input:focus { border-color: var(--orange); }
  .admin-row input::placeholder { color: var(--muted2); }
  #seg-list-admin {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
  }
  .seg-tag {
    background: var(--surface3); border: 1px solid var(--border2);
    border-radius: 99px; padding: 4px 10px;
    font-size: 12px; font-family: 'DM Mono', monospace;
    display: flex; align-items: center; gap: 6px;
  }
  .seg-tag-remove {
    cursor: pointer; color: var(--muted); line-height: 1;
    font-size: 14px;
  }
  .seg-tag-remove:hover { color: var(--orange); }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 12px 18px;
    font-size: 13px; color: var(--text);
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none; z-index: 9999;
  }
  #toast.show { opacity: 1; }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; }
  .tab {
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 16px;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .tab.active { background: var(--surface2); color: var(--text); border-color: var(--border2); }

  .hidden { display: none !important; }

  /* ── GENDER MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 500;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 2rem;
    max-width: 380px; width: 90%;
    text-align: center;
  }
  .modal h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; }
  .gender-btns { display: flex; gap: 10px; justify-content: center; }
  .gender-btn {
    flex: 1; padding: 14px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.15s;
  }
  .gender-btn:hover { background: var(--surface3); border-color: var(--orange); color: var(--orange); }
  .gender-note { font-size: 11px; color: var(--muted2); margin-top: 12px; }

  /* ── SECTION DIVIDER ── */
  .lb-section { margin-bottom: 2.5rem; }
  .lb-section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 3px;
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 12px;
  }
  .lb-section-title .pill {
    font-size: 11px; font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    border-radius: 99px; padding: 3px 10px;
    font-weight: 400;
  }
  .pill-w { background: rgba(236,72,153,0.15); color: #f472b6; }
  .pill-m { background: rgba(59,130,246,0.15); color: #60a5fa; }
</style>
</head>

  REDIRECT_URI: https:/liam-ereneta.github.io/hot-hill-summer/,

  // 3. Add your segment IDs here (find them in segment URLs on Strava)
  //    e.g. https://www.strava.com/segments/1234567  → ID is 1234567
  //    Leave empty [] to let the admin configure via the UI
  SEGMENT_IDS: [
    9657846,
    639738,
    5816161,
    522461,
    229781,
    647010,
    622149,
    1707949,
    563888,
    632391,
    626859,
  ],

  // 4. Title shown on the leaderboard
  LEADERBOARD_TITLE: "HOT HILL SUMMER",

  // 5. Set to your own Strava athlete ID to enable the admin panel
  //    (Find it by visiting your Strava profile — number in the URL)
  ADMIN_ATHLETE_ID: 87362903,
};
</script>

<header>
  <div class="logo">HILL<span> CLUB</span></div>
  <div class="header-right" id="header-right">
    <button class="btn" id="header-connect-btn" onclick="startOAuth()">
      Connect Strava
    </button>
  </div>
</header>

<div id="toast"></div>

<main id="main-content">
  <!-- Injected by JS -->
</main>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let state = {
  athlete: null,        // Strava athlete object
  token: null,          // access token
  segments: [],         // [{id, name}]
  leaderboard: [],      // [{athleteId, name, avatar, segsDone, totalSeconds, efforts:[]}]
  loading: false,
};

const STORAGE_KEY = "lb_data_v2";
const TOKEN_KEY   = "strava_token";

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
async function boot() {
  loadLocalToken();
  await loadSharedData();

  const params = new URLSearchParams(window.location.search);
  if (params.get("code")) {
    await handleOAuthCallback(params.get("code"));
    history.replaceState({}, "", window.location.pathname);
    return;
  }
  if (params.get("error")) {
    history.replaceState({}, "", window.location.pathname);
  }

  render();
  if (state.token && state.athlete) {
    await fetchAndUpdateMyData();
  }
}

// ═══════════════════════════════════════════════
// OAUTH  (Implicit / Token Exchange via proxy)
// ═══════════════════════════════════════════════
// NOTE: Strava's OAuth requires a server to exchange the code for a token
// (client_secret cannot be exposed). Two options:
//   A) Use Strava's "mobile" implicit grant (token in URL hash) — simpler
//   B) Deploy a tiny proxy function (e.g. Netlify/Cloudflare Worker)
//
// This app uses option A by requesting token via response_type=token
// which Strava supports for personal apps.

function startOAuth() {
  const scope = "read,activity:read_all";
  const url = `https://www.strava.com/oauth/authorize`
    + `?client_id=${CONFIG.CLIENT_ID}`
    + `&redirect_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}`
    + `&response_type=token`
    + `&approval_prompt=auto`
    + `&scope=${scope}`;
  window.location.href = url;
}

function loadLocalToken() {
  try {
    const saved = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
    if (saved && saved.expires_at > Date.now() / 1000) {
      state.token   = saved.access_token;
      state.athlete = saved.athlete;
    } else {
      localStorage.removeItem(TOKEN_KEY);
    }
  } catch(e) {}

  // Check implicit grant hash from Strava
  const hash = new URLSearchParams(window.location.hash.replace("#",""));
  if (hash.get("access_token")) {
    state.token = hash.get("access_token");
    const expires = parseInt(hash.get("expires_at") || (Date.now()/1000 + 21600));
    localStorage.setItem(TOKEN_KEY, JSON.stringify({
      access_token: state.token,
      expires_at: expires,
      athlete: null,
    }));
    history.replaceState({}, "", window.location.pathname);
  }
}

async function handleOAuthCallback(code) {
  // If you have a server endpoint to exchange code, call it here.
  // Without a server, Strava won't exchange the code client-side
  // (client_secret required). Use implicit flow (response_type=token) instead.
  toast("Auth code received — this app uses implicit token flow. Please reconnect.");
  render();
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  state.token   = null;
  state.athlete = null;
  render();
}

// ═══════════════════════════════════════════════
// STRAVA API
// ═══════════════════════════════════════════════
async function stravaGet(path) {
  const r = await fetch(`https://www.strava.com/api/v3${path}`, {
    headers: { Authorization: `Bearer ${state.token}` }
  });
  if (!r.ok) throw new Error(`Strava API ${r.status}: ${path}`);
  return r.json();
}

async function fetchAthlete() {
  const a = await stravaGet("/athlete");
  state.athlete = a;
  const saved = JSON.parse(localStorage.getItem(TOKEN_KEY) || "{}");
  saved.athlete = a;
  localStorage.setItem(TOKEN_KEY, JSON.stringify(saved));
  updateHeader();
  return a;
}

async function fetchSegmentName(id) {
  const s = await stravaGet(`/segments/${id}`);
  return s.name;
}

// Summer 2026: Memorial Day (May 25) → Labor Day (Sep 7)
const CHALLENGE_START = "2026-05-25T00:00:00Z";
const CHALLENGE_END   = "2026-09-07T23:59:59Z";

async function fetchMyEffortsForSegment(segId) {
  // Returns best effort within the challenge window only
  try {
    const efforts = await stravaGet(
      `/segment_efforts?segment_id=${segId}&start_date_local=${CHALLENGE_START}&end_date_local=${CHALLENGE_END}&per_page=200`
    );
    if (!efforts.length) return null;
    // Pick the fastest effort in the window
    return efforts.reduce((best, e) => e.elapsed_time < best.elapsed_time ? e : best);
  } catch(e) { return null; }
}

async function fetchAndUpdateMyData() {
  if (!state.token) return;
  state.loading = true;
  renderLeaderboard();

  try {
    if (!state.athlete) await fetchAthlete();
    const segs = getSegments();
    if (!segs.length) { state.loading = false; renderLeaderboard(); return; }

    const efforts = [];
    let totalSeconds = 0;
    let done = 0;

    for (const seg of segs) {
      const effort = await fetchMyEffortsForSegment(seg.id);
      if (effort) {
        efforts.push({ segId: seg.id, elapsed: effort.elapsed_time });
        totalSeconds += effort.elapsed_time;
        done++;
      }
    }

    // Determine gender: saved override > Strava profile
    const savedGender = localStorage.getItem("athlete_gender");
    const stravaGender = state.athlete.sex; // 'M' or 'F'
    const gender = savedGender || stravaGender || "M";

    const entry = {
      athleteId:    state.athlete.id,
      name:         `${state.athlete.firstname} ${state.athlete.lastname}`,
      avatar:       state.athlete.profile_medium || state.athlete.profile,
      gender:       gender,
      segsDone:     done,
      totalSeconds: totalSeconds,
      efforts:      efforts,
      updatedAt:    Date.now(),
    };

    await saveEntryToShared(entry);
    toast(`✓ Leaderboard updated — ${done}/${segs.length} segments`);
  } catch(e) {
    toast("Error fetching Strava data: " + e.message);
    console.error(e);
  }
  state.loading = false;
  renderLeaderboard();
}

// ═══════════════════════════════════════════════
// STORAGE (shared leaderboard)
// ═══════════════════════════════════════════════
async function loadSharedData() {
  try {
    // Load segments
    const segsResult = await window.storage.get("segments", true);
    if (segsResult) {
      const segs = JSON.parse(segsResult.value);
      if (Array.isArray(segs)) state.segments = segs;
    }
    // Load leaderboard entries
    const keys = await window.storage.list("athlete:", true);
    const entries = [];
    if (keys && keys.keys) {
      for (const key of keys.keys) {
        const r = await window.storage.get(key, true);
        if (r) {
          try { entries.push(JSON.parse(r.value)); } catch(e) {}
        }
      }
    }
    state.leaderboard = entries;
  } catch(e) {
    // Storage not available (e.g. running locally) — use demo data
    console.warn("Storage unavailable, using demo mode");
    state.leaderboard = DEMO_DATA;
    state.segments = DEMO_SEGMENTS;
  }
}

async function saveEntryToShared(entry) {
  try {
    await window.storage.set(`athlete:${entry.athleteId}`, JSON.stringify(entry), true);
    // Update local leaderboard state
    const idx = state.leaderboard.findIndex(e => e.athleteId === entry.athleteId);
    if (idx >= 0) state.leaderboard[idx] = entry;
    else state.leaderboard.push(entry);
  } catch(e) {
    console.error("Save failed", e);
  }
}

async function saveSegmentsToShared(segs) {
  try {
    await window.storage.set("segments", JSON.stringify(segs), true);
    state.segments = segs;
  } catch(e) {}
}

function getSegments() {
  if (CONFIG.SEGMENT_IDS && CONFIG.SEGMENT_IDS.length) {
    return CONFIG.SEGMENT_IDS.map(id => ({
      id,
      name: state.segments.find(s => s.id === id)?.name || `Segment ${id}`
    }));
  }
  return state.segments;
}

// ═══════════════════════════════════════════════
// RANKING
// ═══════════════════════════════════════════════
function getSortedLeaderboard(gender) {
  let list = state.leaderboard;
  if (gender) list = list.filter(e => (e.gender || "M") === gender);
  return [...list].sort((a, b) => {
    if (b.segsDone !== a.segsDone) return b.segsDone - a.segsDone;
    if (a.segsDone === 0) return 0;
    return a.totalSeconds - b.totalSeconds;
  });
}

function fmtTime(secs) {
  if (!secs) return "—";
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function rankClass(i) {
  return i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "";
}
function rankLabel(i) {
  return i === 0 ? "1" : i === 1 ? "2" : i === 2 ? "3" : i + 1;
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render() {
  if (!state.token || !state.athlete) {
    renderPublic();
  } else {
    renderApp();
  }
}

function renderPublic() {
  const segs = getSegments();
  const hdr = document.getElementById("header-connect-btn");
  if (hdr) hdr.classList.remove("hidden");
  const women = getSortedLeaderboard("F");
  const men   = getSortedLeaderboard("M");

  document.getElementById("main-content").innerHTML = `
    <div class="hero">
      <h1>${CONFIG.LEADERBOARD_TITLE.split(" ").map((w,i) => i===0 ? `<em>${w}</em>` : w).join(" ")}</h1>
      <p>${segs.length} segments · ${state.leaderboard.length} competitors</p>
      <p style="font-size:13px;color:var(--muted);margin-top:6px;font-family:'DM Mono',monospace;">May 25 – Sep 7, 2026 &nbsp;·&nbsp; efforts outside this window don't count</p>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-bottom:1.2rem;">
      <button class="btn" onclick="startOAuth()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066l-2.084 4.116zM9.236 0L4.083 10.172h3.066l2.087-4.122 2.087 4.122h3.063L9.236 0z"/></svg>
        Join the challenge
      </button>
    </div>

    <div class="lb-section">
      <div class="lb-section-title">Women <span class="pill pill-w">${women.length} athletes</span></div>
      ${renderLeaderboardTable(women, null, segs)}
    </div>

    <div class="lb-section">
      <div class="lb-section-title">Men <span class="pill pill-m">${men.length} athletes</span></div>
      ${renderLeaderboardTable(men, null, segs)}
    </div>

    ${segs.length ? `
      <div style="margin-top:2.5rem">
        <div class="section-title">SEGMENTS</div>
        <div class="segments-grid">
          ${segs.map(seg => `
            <div class="seg-card">
              <div class="seg-card-name"><span class="seg-card-dot"></span>${seg.name || "Segment " + seg.id}</div>
              <div class="seg-card-id">${seg.id}</div>
            </div>`).join("")}
        </div>
      </div>` : ""}
  `;
}

function renderApp() {
  updateHeader();
  const segs = getSegments();
  const sorted = getSortedLeaderboard();
  const myId = state.athlete?.id;
  const isAdmin = CONFIG.ADMIN_ATHLETE_ID && myId === CONFIG.ADMIN_ATHLETE_ID;

  document.getElementById("main-content").innerHTML = `
    ${isAdmin ? renderAdminPanel(segs) : ""}

    <div class="hero">
      <h1>${CONFIG.LEADERBOARD_TITLE.split(" ").map((w,i) => i===0 ? `<em>${w}</em>` : w).join(" ")}</h1>
      <p>${segs.length} segments · ${state.leaderboard.length} competitors</p>
      <p style="font-size:13px;color:var(--muted);margin-top:6px;font-family:'DM Mono',monospace;">May 25 – Sep 7, 2026 &nbsp;·&nbsp; efforts outside this window don't count</p>
    </div>

    <div class="notice">
      <span class="spinner ${state.loading ? "" : "hidden"}"></span>
      <span>
        ${state.loading
          ? "Fetching your Strava data…"
          : `Leaderboard last synced. <a href="#" onclick="event.preventDefault();fetchAndUpdateMyData()">Refresh my data ↻</a>`
        }
      </span>
    </div>

    <div class="status-bar">
      <div class="stat-chips">
        <div class="chip"><strong>${segs.length}</strong> segments</div>
        <div class="chip"><strong>${getSortedLeaderboard().length}</strong> athletes</div>
        <div class="chip">Ranked: <strong>segs done → fastest time</strong></div>
      </div>
      <button class="btn btn-ghost" style="font-size:12px;padding:5px 12px" onclick="showGenderModal()">Change my category</button>
    </div>

    <div class="lb-section">
      <div class="lb-section-title">Women <span class="pill pill-w">${getSortedLeaderboard("F").length} athletes</span></div>
      ${renderLeaderboardTable(getSortedLeaderboard("F"), myId, segs)}
    </div>

    <div class="lb-section">
      <div class="lb-section-title">Men <span class="pill pill-m">${getSortedLeaderboard("M").length} athletes</span></div>
      ${renderLeaderboardTable(getSortedLeaderboard("M"), myId, segs)}
    </div>

    ${segs.length ? `
      <div style="margin-top: 2.5rem">
        <div class="section-title">SEGMENTS</div>
        <div class="segments-grid">
          ${segs.map(seg => {
            const myEntry = state.leaderboard.find(e => e.athleteId === myId);
            const done = myEntry?.efforts?.some(e => e.segId === seg.id);
            return `<div class="seg-card">
              <div class="seg-card-name">
                <span class="seg-card-dot ${done ? "done" : ""}"></span>${seg.name || `Segment ${seg.id}`}
              </div>
              <div class="seg-card-id">${seg.id}</div>
            </div>`;
          }).join("")}
        </div>
      </div>
    ` : ""}
  `;

  if (isAdmin) initAdminPanel(segs);
}

function renderLeaderboardTable(sorted, myId, segs) {
  if (!sorted.length) {
    return `<div class="lb-wrap">
      <div class="empty-state">
        <div class="big-icon">🏁</div>
        <h2>No entries yet</h2>
        <p>Be the first to join the leaderboard!</p>
      </div>
    </div>`;
  }

  const totalSegs = segs.length || 1;

  return `<div class="lb-wrap">
    <div class="lb-head">
      <div>#</div><div>Athlete</div>
      <div>Segments</div><div>Total time</div><div>Avg/seg</div>
    </div>
    ${sorted.map((entry, i) => {
      const isYou = entry.athleteId === myId;
      const avgSecs = entry.segsDone ? Math.round(entry.totalSeconds / entry.segsDone) : 0;
      const pct = Math.round((entry.segsDone / totalSegs) * 100);
      return `<div class="lb-row ${isYou ? "is-you" : ""}">
        <div class="rank ${rankClass(i)}">${rankLabel(i)}</div>
        <div class="athlete-cell">
          <img class="ath-avatar" src="${entry.avatar || ""}" onerror="this.style.display='none'" alt="">
          <div>
            <span class="ath-name">${entry.name}</span>
            ${isYou ? '<span class="ath-you">you</span>' : ""}
          </div>
        </div>
        <div>
          <div class="lb-num segs-done">${entry.segsDone}<span style="color:var(--muted);font-size:12px">/${totalSegs}</span></div>
          <div class="seg-bar-wrap">
            <div class="seg-bar"><div class="seg-bar-fill" style="width:${pct}%"></div></div>
            ${pct}%
          </div>
        </div>
        <div class="lb-num">${fmtTime(entry.totalSeconds)}</div>
        <div class="lb-num" style="color:var(--muted)">${avgSecs ? fmtTime(avgSecs) : "—"}</div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderLeaderboard() {
  // Full re-render is simplest given two tables
  if (state.athlete) renderApp(); else renderPublic();
}

function renderAdminPanel(segs) {
  return `<div id="admin-panel">
    <h3>ADMIN — Manage Segments</h3>
    <div class="admin-row">
      <input id="seg-id-input" type="number" placeholder="Strava segment ID (e.g. 1234567)">
      <input id="seg-name-input" type="text" placeholder="Segment name (optional — fetched automatically)">
      <button class="btn" onclick="adminAddSegment()">Add</button>
    </div>
    <div id="seg-list-admin">
      ${segs.map(s => `
        <div class="seg-tag">
          ${s.name || s.id}
          <span class="seg-tag-remove" onclick="adminRemoveSegment(${s.id})">×</span>
        </div>`).join("")}
    </div>
  </div>`;
}

function initAdminPanel(segs) {
  // already rendered inline
}

async function adminAddSegment() {
  const idInput   = document.getElementById("seg-id-input");
  const nameInput = document.getElementById("seg-name-input");
  const id = parseInt(idInput.value);
  if (!id) { toast("Enter a valid segment ID"); return; }
  const segs = getSegments();
  if (segs.find(s => s.id === id)) { toast("Segment already added"); return; }

  let name = nameInput.value.trim();
  if (!name && state.token) {
    toast("Fetching segment name…");
    try { name = await fetchSegmentName(id); } catch(e) { name = `Segment ${id}`; }
  }
  name = name || `Segment ${id}`;
  const updated = [...segs, { id, name }];
  await saveSegmentsToShared(updated);
  idInput.value = ""; nameInput.value = "";
  toast(`Added: ${name}`);
  renderApp();
}

async function adminRemoveSegment(id) {
  const segs = getSegments().filter(s => s.id !== id);
  await saveSegmentsToShared(segs);
  toast("Segment removed");
  renderApp();
}

function updateHeader() {
  const hr = document.getElementById("header-right");
  if (state.athlete) {
    document.getElementById("header-connect-btn")?.classList.add("hidden");
    hr.innerHTML = `
      <div class="avatar-pill">
        <img class="avatar-img" src="${state.athlete.profile_medium || state.athlete.profile}" alt="">
        ${state.athlete.firstname}
      </div>
      <button class="btn btn-ghost" onclick="logout()">Sign out</button>
    `;
  }
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
function showGenderModal() {
  // Remove existing modal if any
  document.getElementById("gender-modal")?.remove();
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.id = "gender-modal";
  const current = localStorage.getItem("athlete_gender") || state.athlete?.sex || "M";
  backdrop.innerHTML = `
    <div class="modal">
      <h2>Your Category</h2>
      <p>Strava reported <strong>${state.athlete?.sex === "F" ? "Women" : "Men"}</strong> for your account. You can override this below.</p>
      <div class="gender-btns">
        <button class="gender-btn" onclick="setGender('F')" style="${current==='F'?'border-color:var(--orange);color:var(--orange)':''}">Women</button>
        <button class="gender-btn" onclick="setGender('M')" style="${current==='M'?'border-color:var(--orange);color:var(--orange)':''}">Men</button>
      </div>
      <p class="gender-note">This updates which leaderboard you appear on.<br>Changes take effect on your next data refresh.</p>
      <button class="btn btn-ghost" style="margin-top:1rem;width:100%;justify-content:center" onclick="document.getElementById('gender-modal').remove()">Cancel</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", e => { if (e.target === backdrop) backdrop.remove(); });
}

async function setGender(g) {
  localStorage.setItem("athlete_gender", g);
  document.getElementById("gender-modal")?.remove();
  toast(`Category set to ${g === "F" ? "Women" : "Men"} — refresh your data to update the leaderboard`);
  await fetchAndUpdateMyData();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
}
